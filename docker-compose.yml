# Development stack (docs/07 §2).
#
#   docker compose up -d --build   → PostgreSQL, Redis, Django (:8000), Celery
#   cd Rorschach && npm start      → Angular (:4200), proxying /api and /ws to :8000
#
# The Angular dev server stays outside Docker on purpose: file watching through
# a bind mount on Windows is slow, and `npm start` already proxies to :8000.
# Object storage is external in production.
name: rorschach

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  # Development-only key; production reads SECRET_KEY from the environment.
  SECRET_KEY: ${SECRET_KEY:-docker-development-key-not-for-production-0123456789}
  DEBUG: 'True'
  DATABASE_URL: postgres://${POSTGRES_USER:-rorschach}:${POSTGRES_PASSWORD:-rorschach}@postgres:5432/${POSTGRES_DB:-rorschach}
  REDIS_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
  CSRF_TRUSTED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
  REFRESH_COOKIE_SECURE: 'False'

services:
  postgres:
    image: postgres:17-alpine
    container_name: rorschach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rorschach}
      POSTGRES_USER: ${POSTGRES_USER:-rorschach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rorschach}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    container_name: rorschach-redis
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
      args:
        # Point at a mirror on hosts that reach pypi.org unreliably.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: rorschach-backend
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
      # Test accounts (password Test1234) — see documentation/11-backend-notes.md.
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - ./backend:/app
      - backend-media:/app/media
    ports: ['8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s

  celery:
    build:
      context: ./backend
      target: development
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: rorschach-celery
    restart: unless-stopped
    init: true
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
      # The backend container already migrated and seeded.
      SEED_DEMO: 'false'
      RUN_MIGRATIONS: 'false'
    volumes:
      - ./backend:/app
      - backend-media:/app/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  backend-media:
